[package]
name = "p1mo_dev"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"

tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

ufs = "0.1.4"
url = "2.5.8"
syntect = "5.3.0"
mime_guess = "2.0.5"
handlebars = "6.4.4"

schemars = "1.2.2"
serde_json = "1.0.152"
serde = { version = "1.0.229", features = ["derive"] }

tokio = { version = "1.53.3", features = ["macros", "rt-multi-thread", "signal", "time"] }
reqwest = { version = "0.13.5", features = ["json", "stream", "socks", "rustls", "zstd", "gzip", "brotli", "deflate"] }
salvo = { version = "1.0.1", features = ["affix-state", "trailing-slash", "force-https", "quinn", "logging", "timeout"] } 